<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RestMan Gourmet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: {
  obs: { 950: '#07080a', 900: '#0d0e12', 800: '#14171f', 700: '#1e232f' },
  gold: { 300: '#fde047', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
}}}};
</script>
<style>
  body { font-family: 'Vazirmatn', 'Outfit', sans-serif; }
  .hidden { display: none !important; }
  input, textarea, select { color: #fff; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #1e232f; border-radius: 9px; }

  .glass { background: rgba(20,23,31,.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.08); }
  .card { background: rgba(30,35,47,.5); border: 1px solid rgba(255,255,255,.06); transition: transform .3s, border-color .3s, box-shadow .3s; }
  .card:hover { border-color: rgba(245,158,11,.4); transform: translateY(-4px); box-shadow: 0 12px 30px -12px rgba(245,158,11,.25); }
  .gold-text { background: linear-gradient(135deg,#FFF5D6,#F59E0B 50%,#B45309); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .section-title::after { content: ''; display: block; width: 56px; height: 3px; margin: 10px auto 0; border-radius: 9px; background: linear-gradient(90deg,#f59e0b,#d97706); }

  .btn-gold { position: relative; overflow: hidden; background: linear-gradient(90deg,#f59e0b,#d97706); color: #07080a; font-weight: 800; transition: filter .2s, transform .2s, box-shadow .2s; box-shadow: 0 6px 18px -8px rgba(245,158,11,.7); }
  .btn-gold::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%); transform: translateX(-120%); }
  .btn-gold:hover::after { transform: translateX(120%); transition: transform .7s; }
  .btn-gold:hover { filter: brightness(1.08); }
  .btn-gold:active { transform: scale(.97); }

  /* Side panels (menu drawer and cart) */
  .side { transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .off-start { transform: translateX(-100%); }
  [dir=rtl] .off-start { transform: translateX(100%); }
  .off-end { transform: translateX(100%); }
  [dir=rtl] .off-end { transform: translateX(-100%); }
  .side.open { transform: none !important; }

  /* Hamburger icon */
  .burger-bar { display: block; width: 20px; height: 2px; border-radius: 2px; background: #fbbf24; transition: transform .3s, opacity .3s; }
  .burger.open .burger-bar:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .burger.open .burger-bar:nth-child(2) { opacity: 0; }
  .burger.open .burger-bar:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

  /* Animations */
  @keyframes fadeUp { from { opacity: 0; translate: 0 16px; } to { opacity: 1; translate: 0 0; } }
  @keyframes modalIn { from { opacity: 0; scale: .94; translate: 0 12px; } to { opacity: 1; scale: 1; translate: 0 0; } }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
  @keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -10px; } }
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(245,158,11,.6); } 100% { box-shadow: 0 0 0 12px rgba(245,158,11,0); } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes toastIn { from { opacity: 0; translate: 0 20px; } to { opacity: 1; translate: 0 0; } }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-20px); } }
  @keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: -8px 0; } 75% { translate: 8px 0; } }

  .fade-up { animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) both; }
  .reveal { opacity: 0; }
  .reveal.in { animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both; }
  .modal-in { animation: modalIn .35s cubic-bezier(.2,.8,.2,1) both; }
  .kenburns { animation: kenburns 18s ease-in-out infinite alternate; }
  .float { animation: float 5s ease-in-out infinite; }
  .pulse-ring { animation: pulseRing 1.6s infinite; }
  .bump { animation: bump .4s ease; }
  .toast-in { animation: toastIn .35s cubic-bezier(.2,.8,.2,1) both; }
  .shake { animation: shake .3s ease; }
  .blob { position: absolute; border-radius: 9999px; filter: blur(60px); opacity: .25; pointer-events: none; animation: drift 12s ease-in-out infinite; }

  .stat { transition: transform .3s, border-color .3s; }
  .stat:hover { transform: translateY(-3px); border-color: rgba(245,158,11,.4); }
  .act { padding: .5rem .9rem; border-radius: .75rem; font-size: .8rem; font-weight: 700; transition: transform .2s, filter .2s; }
  .act:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .act:active { transform: scale(.96); }
  .act-ok { background: #10b981; color: #03150e; }
  .act-go { background: #0ea5e9; color: #021019; }
  .act-no { background: rgba(244,63,94,.12); color: #fb7185; border: 1px solid rgba(244,63,94,.4); }
  .act-del { color: #fb7185; font-size: .75rem; opacity: .8; transition: opacity .2s; }
  .act-del:hover { opacity: 1; }

  .badge { font-size: .7rem; font-weight: 700; padding: .25rem .6rem; border-radius: 9999px; }
  .b-new { background: rgba(245,158,11,.15); color: #fbbf24; }
  .b-prep { background: rgba(56,189,248,.15); color: #7dd3fc; }
  .b-way { background: rgba(167,139,250,.15); color: #c4b5fd; }
  .b-done { background: rgba(16,185,129,.15); color: #6ee7b7; }
  .b-cancel { background: rgba(244,63,94,.15); color: #fda4af; }
  .tag-hot { position: absolute; top: .75rem; inset-inline-start: .75rem; z-index: 2; font-size: .7rem; font-weight: 800; padding: .3rem .7rem; border-radius: 9999px; background: rgba(7,8,10,.75); color: #fbbf24; border: 1px solid rgba(245,158,11,.4); backdrop-filter: blur(6px); }
  .opt-on { box-shadow: 0 0 0 2px #f59e0b, 0 8px 22px -10px rgba(245,158,11,.7); }
</style>
</head>
<body class="bg-obs-950 text-slate-100 antialiased overflow-x-hidden">

<!-- LANGUAGE PICKER -->
<div id="lang-picker" class="fixed inset-0 z-[70] bg-obs-950/95 backdrop-blur-md flex items-center justify-center p-4">
  <div class="glass rounded-3xl p-8 max-w-sm w-full text-center border border-gold-500/40 modal-in">
    <i class="fa-solid fa-burger text-gold-400 text-3xl mb-3 float inline-block"></i>
    <h2 class="text-2xl font-black text-white mb-1">RestMan Gourmet</h2>
    <p class="text-sm text-slate-400 mb-6">زمانەکەت هەڵبژێرە / اختر لغتك / Choose your language</p>
    <div class="space-y-3">
      <button onclick="setLang('ku')" class="w-full py-3 rounded-xl btn-gold text-base">کوردی</button>
      <button onclick="setLang('ar')" class="w-full py-3 rounded-xl btn-gold text-base">العربية</button>
      <button onclick="setLang('en')" class="w-full py-3 rounded-xl btn-gold text-base">English</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="sticky top-0 z-40 glass">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <a href="#hero" class="flex items-center gap-2">
      <i class="fa-solid fa-burger text-gold-400 text-xl"></i>
      <span class="text-xl font-black text-white">Rest<span class="gold-text">Man</span></span>
    </a>

    <nav class="hidden md:flex gap-7 text-sm text-slate-300 font-semibold">
      <a href="#menu" class="hover:text-gold-400 transition" data-i="nav_menu"></a>
      <a href="#builder" class="hover:text-gold-400 transition" data-i="nav_build"></a>
      <a href="#about" class="hover:text-gold-400 transition" data-i="nav_about"></a>
    </nav>

    <div class="flex items-center gap-2">
      <button onclick="toggleCart(true)" class="relative w-11 h-11 rounded-xl btn-gold flex items-center justify-center" aria-label="cart">
        <i class="fa-solid fa-basket-shopping"></i>
        <span id="cart-count" class="absolute -top-1.5 -end-1.5 bg-obs-950 text-gold-400 text-[11px] rounded-full min-w-[20px] h-5 px-1 font-bold flex items-center justify-center border border-gold-500/50">0</span>
      </button>
      <button id="burger" onclick="toggleDrawer(true)" class="burger w-11 h-11 rounded-xl card flex flex-col items-center justify-center gap-1.5" aria-label="menu">
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
      </button>
    </div>
  </div>
</header>

<!-- SIDE MENU (three lines) -->
<div id="backdrop" onclick="closeSides()" class="fixed inset-0 bg-black/70 z-40 hidden"></div>

<aside id="drawer" class="side off-start open-ready fixed top-0 bottom-0 w-80 max-w-[85vw] bg-obs-900 z-50 flex flex-col p-6 border-e border-slate-800" style="inset-inline-start:0">
  <div class="flex justify-between items-center pb-5 border-b border-slate-800">
    <span class="text-xl font-black text-white">Rest<span class="gold-text">Man</span></span>
    <button onclick="toggleDrawer(false)" class="w-10 h-10 rounded-xl card text-slate-300 hover:text-white transition hover:rotate-90 duration-300"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <nav class="flex flex-col gap-2 py-5">
    <a href="#menu" onclick="toggleDrawer(false)" class="card rounded-xl px-4 py-3 flex items-center gap-3 font-bold"><i class="fa-solid fa-utensils text-gold-400 w-5"></i><span data-i="nav_menu"></span></a>
    <a href="#builder" onclick="toggleDrawer(false)" class="card rounded-xl px-4 py-3 flex items-center gap-3 font-bold"><i class="fa-solid fa-wand-magic-sparkles text-gold-400 w-5"></i><span data-i="nav_build"></span></a>
    <a href="#about" onclick="toggleDrawer(false)" class="card rounded-xl px-4 py-3 flex items-center gap-3 font-bold"><i class="fa-solid fa-circle-info text-gold-400 w-5"></i><span data-i="nav_about"></span></a>
  </nav>

  <div class="pt-4 border-t border-slate-800">
    <p class="text-xs font-bold text-gold-400 mb-3" data-i="lang_t"></p>
    <div class="grid grid-cols-3 gap-2">
      <button onclick="setLang('ku')" class="py-2.5 rounded-xl card text-sm font-bold">کوردی</button>
      <button onclick="setLang('ar')" class="py-2.5 rounded-xl card text-sm font-bold">العربية</button>
      <button onclick="setLang('en')" class="py-2.5 rounded-xl card text-sm font-bold">English</button>
    </div>
  </div>

  <div class="mt-auto pt-4 border-t border-slate-800">
    <button onclick="openAdmin()" class="w-full py-3 rounded-xl card text-sm font-bold text-slate-300 hover:text-gold-400 transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-lock"></i> <span data-i="admin"></span>
    </button>
  </div>
</aside>

<main class="relative z-10">

  <!-- HERO -->
  <section id="hero" class="relative overflow-hidden">
    <div class="absolute inset-0 overflow-hidden">
      <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1600&q=80" alt="" class="kenburns w-full h-full object-cover opacity-40">
      <div class="absolute inset-0 bg-gradient-to-b from-obs-950/30 via-obs-950/75 to-obs-950"></div>
    </div>
    <div class="blob bg-amber-500 w-72 h-72 -top-10 -start-10"></div>
    <div class="blob bg-orange-600 w-80 h-80 top-20 end-0" style="animation-delay:-4s"></div>

    <div class="relative max-w-6xl mx-auto px-4 pt-20 pb-20 text-center">
      <span class="inline-block text-xs font-bold text-gold-400 border border-gold-500/40 rounded-full px-4 py-1.5 mb-6 fade-up" data-i="hero_tag"></span>
      <h1 class="text-4xl sm:text-6xl font-black text-white leading-tight fade-up" data-i="hero_t"></h1>
      <p class="mt-5 text-slate-300 max-w-2xl mx-auto leading-relaxed fade-up" style="animation-delay:.15s" data-i="hero_d"></p>
      <div class="mt-8 flex flex-wrap justify-center gap-3 fade-up" style="animation-delay:.3s">
        <a href="#menu" class="px-8 py-3.5 rounded-xl btn-gold" data-i="hero_cta"></a>
        <a href="#builder" class="px-8 py-3.5 rounded-xl card font-bold text-white" data-i="hero_cta2"></a>
      </div>

      <div class="mt-14 grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-3xl mx-auto fade-up" style="animation-delay:.45s">
        <div class="glass rounded-2xl p-4 flex items-center gap-3"><i class="fa-solid fa-medal text-gold-400 text-xl"></i><span class="font-bold text-sm" data-i="f1"></span></div>
        <div class="glass rounded-2xl p-4 flex items-center gap-3"><i class="fa-solid fa-motorcycle text-gold-400 text-xl"></i><span class="font-bold text-sm" data-i="f2"></span></div>
        <div class="glass rounded-2xl p-4 flex items-center gap-3"><i class="fa-solid fa-leaf text-gold-400 text-xl"></i><span class="font-bold text-sm" data-i="f3"></span></div>
      </div>
    </div>
  </section>

  <!-- MENU -->
  <section id="menu" class="max-w-6xl mx-auto px-4 py-16 scroll-mt-20">
    <h2 class="text-3xl font-black text-white text-center mb-2 section-title reveal" data-i="menu_t"></h2>
    <p class="text-center text-slate-400 text-sm mb-8 reveal" data-i="menu_sub"></p>

    <div class="flex gap-2 overflow-x-auto pb-3 mb-6 justify-start md:justify-center" id="cats"></div>

    <div class="relative max-w-md mx-auto mb-10">
      <i class="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 start-4 text-slate-500"></i>
      <input id="search" type="text" oninput="renderMenu()" data-ph="search" class="w-full bg-obs-900 border border-slate-800 rounded-xl ps-11 pe-4 py-3 text-sm focus:border-gold-500 outline-none transition">
    </div>

    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>

  <!-- CUSTOM BUILDER -->
  <section id="builder" class="max-w-6xl mx-auto px-4 py-16 scroll-mt-20 border-t border-slate-800/70">
    <h2 class="text-3xl font-black text-white text-center mb-10 section-title reveal" data-i="build_t"></h2>
    <div class="grid lg:grid-cols-12 gap-8">
      <div class="lg:col-span-7 glass rounded-3xl p-6 sm:p-8 space-y-7 reveal">
        <div class="flex rounded-2xl p-1 bg-obs-950 border border-slate-800">
          <button id="bt-pizza" onclick="setBType('pizza')" class="w-1/2 py-3 rounded-xl font-bold text-sm transition"></button>
          <button id="bt-burger" onclick="setBType('burger')" class="w-1/2 py-3 rounded-xl font-bold text-sm transition"></button>
        </div>
        <div><p class="text-xs font-bold text-gold-400 mb-3" data-i="size"></p><div id="b-base" class="grid grid-cols-3 gap-3"></div></div>
        <div><p class="text-xs font-bold text-gold-400 mb-3" data-i="sauce"></p><div id="b-sauce" class="grid grid-cols-2 gap-3"></div></div>
        <div><p class="text-xs font-bold text-gold-400 mb-3" data-i="extras"></p><div id="b-tops" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div></div>
      </div>

      <div class="lg:col-span-5 glass rounded-3xl p-6 sm:p-8 text-center border border-gold-500/30 reveal lg:sticky lg:top-24 self-start">
        <div class="overflow-hidden rounded-2xl mb-6">
          <img id="b-img" alt="" class="w-full h-52 object-cover transition duration-500 hover:scale-105">
        </div>
        <p class="text-slate-400 text-sm mb-1" data-i="preview"></p>
        <div id="b-price" class="text-4xl font-black text-gold-400 font-mono mb-6">0</div>
        <button onclick="addBuilt()" class="w-full py-4 rounded-xl btn-gold" data-i="add_built"></button>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about" class="max-w-6xl mx-auto px-4 py-16 scroll-mt-20 border-t border-slate-800/70 text-center reveal">
    <h2 class="text-3xl font-black text-white mb-4 section-title" data-i="nav_about"></h2>
    <p class="text-slate-400 max-w-2xl mx-auto leading-relaxed" data-i="about_t"></p>
  </section>
</main>

<!-- FOOTER -->
<footer class="border-t border-slate-800 py-12 mt-10 bg-obs-900/40">
  <div class="max-w-6xl mx-auto px-4 grid md:grid-cols-3 gap-8 text-sm text-slate-400">
    <div>
      <h4 class="font-bold text-gold-400 mb-2 flex items-center gap-2"><i class="fa-regular fa-clock"></i> <span data-i="hours"></span></h4>
      <p data-i="hours_v"></p>
    </div>
    <div>
      <h4 class="font-bold text-gold-400 mb-2 flex items-center gap-2"><i class="fa-solid fa-phone"></i> <span data-i="contact"></span></h4>
      <p dir="ltr" class="text-start">+964 750 123 4567</p>
      <p data-i="addr"></p>
    </div>
    <div class="md:text-end">
      <p class="font-bold text-white mb-2">RestMan Gourmet</p>
      <p data-i="footer"></p>
    </div>
  </div>
</footer>

<!-- CART DRAWER -->
<aside id="cart" class="side off-end fixed top-0 bottom-0 w-full max-w-md bg-obs-900 z-50 flex flex-col p-6 border-s border-slate-800" style="inset-inline-end:0">
  <div class="flex justify-between items-center pb-4 border-b border-slate-800">
    <h3 class="font-black text-white text-lg flex items-center gap-2"><i class="fa-solid fa-basket-shopping text-gold-400"></i> <span data-i="cart"></span></h3>
    <button onclick="toggleCart(false)" class="w-10 h-10 rounded-xl card text-slate-300 hover:text-white transition hover:rotate-90 duration-300"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="cart-items" class="flex-1 overflow-y-auto py-4 space-y-3"></div>
  <div class="border-t border-slate-800 pt-4 space-y-3">
    <div class="flex gap-2">
      <input id="promo" type="text" data-ph="promo" class="flex-1 bg-obs-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm uppercase outline-none focus:border-gold-500 transition">
      <button onclick="applyPromo()" class="px-4 rounded-xl card text-gold-400 text-sm font-bold" data-i="apply"></button>
    </div>
    <div class="text-sm space-y-1.5 text-slate-400">
      <div class="flex justify-between"><span data-i="sub"></span><span id="c-sub" class="font-mono"></span></div>
      <div class="flex justify-between"><span data-i="disc"></span><span id="c-disc" class="font-mono text-emerald-400"></span></div>
    </div>
    <div class="flex justify-between font-black text-white text-lg"><span data-i="grand_cart"></span><span id="c-total" class="font-mono text-gold-400"></span></div>
    <button onclick="openCheckout()" class="w-full py-3.5 rounded-xl btn-gold" data-i="checkout"></button>
  </div>
</aside>

<!-- CHECKOUT MODAL -->
<div id="checkout" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
  <div class="glass rounded-3xl p-6 sm:p-7 max-w-lg w-full max-h-[90vh] overflow-y-auto relative modal-in">
    <button onclick="closeModal('checkout')" class="absolute top-4 end-4 w-9 h-9 rounded-lg card text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
    <h3 class="text-xl font-black text-white mb-5" data-i="checkout"></h3>
    <form id="order-form" onsubmit="submitOrder(event)" class="space-y-4">
      <div class="grid grid-cols-2 gap-2 p-1 bg-obs-950 rounded-xl border border-slate-800">
        <label class="text-center py-2.5 rounded-lg text-sm font-bold cursor-pointer transition"><input type="radio" name="otype" value="delivery" checked class="hidden"><span data-i="delivery"></span></label>
        <label class="text-center py-2.5 rounded-lg text-sm font-bold cursor-pointer transition"><input type="radio" name="otype" value="takeaway" class="hidden"><span data-i="takeaway"></span></label>
      </div>
      <input name="cname" required data-ph="name" class="w-full bg-obs-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-gold-500 transition">
      <input name="cphone" required type="tel" data-ph="phone" dir="ltr" class="w-full bg-obs-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-gold-500 transition">
      <textarea name="caddr" id="caddr" rows="2" data-ph="address" class="w-full bg-obs-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-gold-500 transition"></textarea>
      <div>
        <p class="text-xs text-gold-400 font-bold mb-2" data-i="pay"></p>
        <div class="grid grid-cols-2 gap-2">
          <label class="card rounded-xl p-3 text-sm flex items-center gap-2 cursor-pointer"><input type="radio" name="pay" value="cash" checked class="accent-amber-500"> <span data-i="cash"></span></label>
          <label class="card rounded-xl p-3 text-sm flex items-center gap-2 cursor-pointer"><input type="radio" name="pay" value="card" class="accent-amber-500"> <span data-i="card"></span></label>
        </div>
      </div>
      <div class="flex justify-between items-center font-black text-gold-400 pt-2 border-t border-slate-800"><span data-i="grand_cart"></span><span id="co-total" class="font-mono text-xl"></span></div>
      <button type="submit" class="w-full py-4 rounded-xl btn-gold" data-i="send"></button>
    </form>
  </div>
</div>

<!-- DONE MODAL -->
<div id="done" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
  <div class="glass rounded-3xl p-8 max-w-sm w-full text-center border border-gold-500/40 modal-in">
    <i class="fa-solid fa-circle-check text-emerald-400 text-5xl mb-4 float inline-block"></i>
    <h3 class="text-xl font-black text-white mb-2" data-i="done"></h3>

/* ================= REVEAL ON SCROLL ================= */
const io = new IntersectionObserver(entries => entries.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: 0.12 });
function revealAll() { document.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el)); }

/* ================= SIDE PANELS ================= */
function toggleDrawer(show) {
  $('drawer').classList.toggle('open', show);
  $('burger').classList.toggle('open', show);
  if (show) $('cart').classList.remove('open');
  updateBackdrop();
}
function toggleCart(show) {
  $('cart').classList.toggle('open', show);
  if (show) $('drawer').classList.remove('open');
  $('burger').classList.remove('open');
  updateBackdrop();
}
function closeSides() {
  $('drawer').classList.remove('open');
  $('cart').classList.remove('open');
  $('burger').classList.remove('open');
  updateBackdrop();
}
function updateBackdrop() {
  const open = $('drawer').classList.contains('open') || $('cart').classList.contains('open');
  $('backdrop').classList.toggle('hidden', !open);
}

function setLang(l) {

  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t(el.dataset.ph));
  $('lang-picker').classList.add('hidden');
  renderCats(); renderMenu(); renderBuilder(); renderCart(); renderAdmin();
}

}
function setCat(c) { cat = c; renderCats(); renderMenu(); }
function renderMenu() {
  const q = ($('search').value || '').toLowerCase();
  const items = MENU.filter(m => (cat === 'all' || m.c === cat) && m.n[lang].toLowerCase().includes(q));
  if (!items.length) {
    $('menu-grid').innerHTML = `<p class="col-span-full text-center text-slate-500 py-12">${t('none')}</p>`;
    return;
  }
  $('menu-grid').innerHTML = items.map((m, i) => `
    <div class="card reveal rounded-3xl overflow-hidden flex flex-col" style="transition-delay:${i * 0.05}s">
      <div class="relative w-full h-52 overflow-hidden bg-obs-900">
        ${m.hot ? `<span class="tag-hot">★ ${t('hot')}</span>` : ''}

  revealAll();
}
function addMenu(id) {
  const m = MENU.find(x => x.id === id);
  if (m) addItem(m.n[lang], m.p);
}

/* ================= BUILDER ================= */
function setBType(type) { bType = type; bBase = 1; bSauce = 0; bTops = []; renderBuilder(); }
function renderBuilder() {
  const d = BUILD[bType];
  $('bt-pizza').className = `w-1/2 py-3 rounded-xl font-bold text-sm transition duration-300 ${bType === 'pizza' ? 'btn-gold' : 'text-slate-400'}`;
  $('bt-burger').className = `w-1/2 py-3 rounded-xl font-bold text-sm transition duration-300 ${bType === 'burger' ? 'btn-gold' : 'text-slate-400'}`;
  $('bt-pizza').textContent = t('bt_pizza'); $('bt-burger').textContent = t('bt_burger');
  $('b-img').src = d.img;
  $('b-img').alt = bType === 'pizza' ? t('bt_pizza') : t('bt_burger');
  const opts = (arr, sel, fn) => arr.map((o, i) => `
    <button onclick="${fn}(${i})" class="p-3 rounded-xl text-sm font-bold transition duration-300 hover:-translate-y-1 ${sel === i ? 'btn-gold opt-on' : 'card text-white'}">
      ${o[lang]}<br><span class="text-xs opacity-80 font-mono">${money(o.p)}</span>
    </button>`).join('');
  $('b-base').innerHTML = opts(d.base, bBase, 'pickBase');
  $('b-sauce').innerHTML = opts(d.sauce, bSauce, 'pickSauce');
  $('b-tops').innerHTML = d.tops.map((o, i) => `
    <label class="card rounded-xl p-3 text-sm flex justify-between items-center cursor-pointer">
      <span>${o[lang]}</span><input type="checkbox" ${bTops.includes(i) ? 'checked' : ''} onchange="toggleTop(${i})" class="accent-amber-500 w-4 h-4">
    </label>`).join('');
  const pr = $('b-price');
  pr.textContent = money(builtPrice());
  pr.classList.remove('bump'); void pr.offsetWidth; pr.classList.add('bump');
}
function pickBase(i) { bBase = i; renderBuilder(); }
function pickSauce(i) { bSauce = i; renderBuilder(); }
function toggleTop(i) { bTops = bTops.includes(i) ? bTops.filter(x => x !== i) : [...bTops, i]; renderBuilder(); }
function builtPrice() {
  const d = BUILD[bType];
  return d.base[bBase].p + d.sauce[bSauce].p + bTops.reduce((s, i) => s + d.tops[i].p, 0);
}
function addBuilt() {
  const d = BUILD[bType];
  const name = (bType === 'pizza' ? t('pizzaName') : t('burgerName')) + ': ' + d.base[bBase][lang];
  const note = [d.sauce[bSauce][lang], ...bTops.map(i => d.tops[i][lang])].join(', ');
  addItem(name, builtPrice(), note);
}

/* ================= CART ================= */
function addItem(name, price, note = '') {
  const found = cart.find(c => c.name === name && c.note === note);
  if (found) found.qty++; else cart.push({ name, price, qty: 1, note });
  renderCart();
  toast(t('added'));
}
function changeQty(i, d) {
  cart[i].qty += d;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  renderCart();
}
function subtotal() { return cart.reduce((s, c) => s + c.price * c.qty, 0); }
function totals(type = 'delivery') {
  const sub = subtotal();
  const disc = Math.round(sub * discount);
  const fee = sub > 0 && type === 'delivery' ? DELIVERY_FEE : 0;
  return { sub, disc, fee, total: sub - disc + fee };
}
function renderCart() {
  const count = cart.reduce((s, c) => s + c.qty, 0);
  const cc = $('cart-count');
  if (cc.textContent !== String(count)) { cc.textContent = count; cc.classList.remove('bump'); void cc.offsetWidth; cc.classList.add('bump'); }
  $('cart-items').innerHTML = cart.length ? cart.map((c, i) => `
    <div class="card rounded-2xl p-3 flex justify-between items-center fade-up">
      <div>
        <p class="font-bold text-white text-sm">${esc(c.name)}</p>
        ${c.note ? `<p class="text-xs text-slate-400 mt-0.5">${esc(c.note)}</p>` : ''}
        <p class="text-gold-400 font-mono text-xs mt-1">${money(c.price * c.qty)}</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="changeQty(${i},-1)" class="w-8 h-8 rounded-lg bg-slate-800 transition hover:bg-slate-700 active:scale-90"><i class="fa-solid fa-minus text-xs"></i></button>
        <span class="font-mono w-5 text-center">${c.qty}</span>
        <button onclick="changeQty(${i},1)" class="w-8 h-8 rounded-lg bg-slate-800 transition hover:bg-slate-700 active:scale-90"><i class="fa-solid fa-plus text-xs"></i></button>
      </div>
    </div>`).join('') : `
    <div class="text-center text-slate-500 py-16 fade-up">
      <i class="fa-solid fa-basket-shopping text-4xl mb-4 opacity-40"></i>
      <p>${t('empty')}</p>
    </div>`;
  const tt = totals();
  $('c-sub').textContent = money(tt.sub);
  $('c-disc').textContent = tt.disc ? '-' + money(tt.disc) : '-';
  $('c-total').textContent = money(tt.sub ? tt.total : 0);
}
function applyPromo() {
  if ($('promo').value.trim().toUpperCase() === PROMO.code) { discount = PROMO.rate; toast(t('promoOk')); }
  else { discount = 0; toast(t('promoBad')); }
  renderCart();
}

/* ================= CHECKOUT ================= */
function openCheckout() {
  if (!cart.length) return toast(t('empty'));
  toggleCart(false);
  updateCheckoutTotal();
  $('checkout').classList.remove('hidden');
}
function updateCheckoutTotal() {
  const type = document.querySelector('input[name=otype]:checked').value;
  const addr = $('caddr');
  addr.required = type === 'delivery';
  addr.parentElement.classList.toggle('hidden', type !== 'delivery');
  document.querySelectorAll('input[name=otype]').forEach(r => {
    r.parentElement.className = `text-center py-2.5 rounded-lg text-sm font-bold cursor-pointer transition duration-300 ${r.checked ? 'btn-gold' : 'text-slate-400'}`;
  });
  $('co-total').textContent = money(totals(type).total);
}
document.addEventListener('change', e => { if (e.target.name === 'otype') updateCheckoutTotal(); });

async function submitOrder(e) {
  e.preventDefault();
  const f = e.target;
  const type = f.otype.value;
  const name = f.cname.value.trim(), phone = f.cphone.value.trim(), addr = f.caddr.value.trim();
  if (!name || !phone) return toast(t('needName'));
  if (type === 'delivery' && !addr) return toast(t('needAddr'));
  const tt = totals(type);
  const order = {
    id: '#RM-' + Date.now().toString().slice(-6),
    time: new Date().toISOString(),
    type, name, phone, address: type === 'delivery' ? addr : '',
    pay: f.pay.value,
    items: cart.map(c => ({ name: c.name, qty: c.qty, price: c.price, note: c.note })),
    sub: tt.sub, disc: tt.disc, fee: tt.fee, total: tt.total,
    status: 'new'
  };
  try {
    await apiRequest('/api/orders', { method: 'POST', body: JSON.stringify(order) });
  } catch (error) {
    console.error('Unable to submit order:', error);
    toast(error.message);
    return;
  }
  if (isAdmin) orders.unshift(order);
  cart = []; discount = 0; $('promo').value = '';
  f.reset(); renderCart();
  renderAdmin();
  closeModal('checkout');
  $('done-id').textContent = order.id;
  const box = $('done').querySelector('.glass');
  $('done').classList.remove('hidden');
  box.classList.remove('modal-in'); void box.offsetWidth; box.classList.add('modal-in');
}

/* ================= STORAGE ================= */
async function apiRequest(path, options = {}) {
  const response = await fetch(`${API_BASE_URL}${path}`, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...options.headers }
  });
  const data = response.status === 204 ? null : await response.json();
  if (!response.ok) {
    const error = new Error(data?.error || `API request failed (${response.status})`);
    error.status = response.status;
    throw error;
  }
  return data;
}
async function adminRequest(path, options = {}) {
  if (!adminToken) throw new Error('Admin login is required');
  return apiRequest(path, {
    ...options,
    headers: { ...options.headers, Authorization: `Bearer ${adminToken}` }
  });
}
async function loadOrders() {
  orders = await adminRequest('/api/orders');
}
async function refreshAdmin(showError = false) {
  if (!isAdmin || refreshingOrders) return;
  refreshingOrders = true;
  try {
    await loadOrders();
    renderAdmin();
  } catch (error) {
    console.error('Unable to refresh orders:', error);
    if (error.status === 401) {
      adminLogout();
      $('admin-login').classList.remove('hidden');
    }
    if (showError || error.status === 401) toast(error.message);
  } finally {
    refreshingOrders = false;
  }
}

/* ================= ADMIN ================= */
function openAdmin() {
  closeSides();
  if (isAdmin) { $('admin-panel').classList.remove('hidden'); refreshAdmin(true); }
  else { $('admin-login').classList.remove('hidden'); $('a-err').classList.add('hidden'); }
}
async function adminLogin() {
  try {
    const auth = await apiRequest('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({ username: $('a-user').value.trim(), password: $('a-pass').value })
    });
    adminToken = auth.token;
    await loadOrders();
    isAdmin = true;
    $('a-pass').value = '';
    closeModal('admin-login');
    $('admin-panel').classList.remove('hidden');
    lastNew = orders.filter(o => o.status === 'new').length;
    renderAdmin();
  } catch (error) {
    adminToken = null;
    isAdmin = false;
    $('a-err').classList.remove('hidden');
    const box = $('login-box');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    if (error.status !== 401) {
      console.error('Unable to authenticate admin:', error);
      toast(error.message);
    }
  }
}
function adminLogout() {
  isAdmin = false;
  adminToken = null;
  $('admin-panel').classList.add('hidden');
}

async function advance(i, status) {
  try {
    await adminRequest(`/api/orders/${encodeURIComponent(orders[i].id)}`, {
      method: 'PATCH',
      body: JSON.stringify({ status })
    });
    await loadOrders();
    renderAdmin();
    toast(status === 'prep' ? t('accepted') : status === 'cancel' ? t('rejected') : t('moved'));
  } catch (error) {
    console.error('Unable to update order:', error);
    if (error.status === 401) { adminLogout(); $('admin-login').classList.remove('hidden'); }
    toast(error.message);
  }
}
async function deleteOrder(i) {
  try {
    await adminRequest(`/api/orders/${encodeURIComponent(orders[i].id)}`, { method: 'DELETE' });
    await loadOrders();
    renderAdmin();
    toast(t('deleted'));
  } catch (error) {
    console.error('Unable to delete order:', error);
    if (error.status === 401) { adminLogout(); $('admin-login').classList.remove('hidden'); }
    toast(error.message);
  }
}
function setFilter(f) { aFilter = f; renderAdmin(); }
async function clearOrders() {
  if (!confirm(t('clear') + '?')) return;
  try {
    await adminRequest('/api/orders', { method: 'DELETE' });
    await loadOrders();
    renderAdmin();
  } catch (error) {
    console.error('Unable to clear orders:', error);
    if (error.status === 401) { adminLogout(); $('admin-login').classList.remove('hidden'); }
    toast(error.message);
  }
}

function filterLabel(f) { return f === 'all' ? t('f_all') : TX[lang].st[f]; }

function actionButtons(o, i) {
  if (o.status === 'new') return `
    <button onclick="advance(${i},'prep')" class="act act-ok"><i class="fa-solid fa-check"></i> ${t('accept')}</button>
    <button onclick="advance(${i},'cancel')" class="act act-no"><i class="fa-solid fa-xmark"></i> ${t('reject')}</button>`;
  if (o.status === 'prep') return `<button onclick="advance(${i},'way')" class="act act-go"><i class="fa-solid fa-motorcycle"></i> ${t('next_way')}</button>`;
  if (o.status === 'way') return `<button onclick="advance(${i},'done')" class="act act-ok"><i class="fa-solid fa-circle-check"></i> ${t('next_done')}</button>`;
  return '';
}

function renderAdmin() {
  if (!isAdmin) return;
  const newCount = orders.filter(o => o.status === 'new').length;
  const activeCount = orders.filter(o => o.status === 'prep' || o.status === 'way').length;
  const revenue = orders.filter(o => o.status !== 'cancel').reduce((s, o) => s + o.total, 0);

  const badge = $('new-badge');
  badge.textContent = newCount || '';
  badge.classList.toggle('hidden', !newCount);
  if (newCount > lastNew) toast(t('newOrder'));
  lastNew = newCount;

  $('stat-total').textContent = orders.length;
  $('stat-new').textContent = newCount;
  $('stat-active').textContent = activeCount;
  $('stat-rev').textContent = money(revenue);

  $('a-filters').innerHTML = FILTERS.map(f => {
    const n = f === 'all' ? orders.length : orders.filter(o => o.status === f).length;
    return `<button onclick="setFilter('${f}')" class="px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition duration-300 ${aFilter === f ? 'btn-gold scale-105' : 'card text-slate-300'}">${filterLabel(f)} <span class="opacity-70 font-mono">(${n})</span></button>`;
  }).join('');

  const list = orders.map((o, i) => ({ o, i })).filter(x => aFilter === 'all' || x.o.status === aFilter);
  if (!list.length) { $('admin-list').innerHTML = `<p class="text-center text-slate-500 py-16 fade-up">${t('none')}</p>`; return; }

  $('admin-list').innerHTML = list.map(({ o, i }) => {
    const animate = !seenOrders.has(o.id);
    seenOrders.add(o.id);
    return `
    <div class="glass rounded-2xl p-5 ${animate ? 'fade-up' : ''} ${o.status === 'new' ? 'border border-gold-500/40' : ''}">
      <div class="flex flex-wrap justify-between gap-3 mb-3">
        <div>
          <p class="font-black text-gold-400 font-mono">${o.id}</p>
          <p class="text-xs text-slate-400">${new Date(o.time).toLocaleString()}</p>
        </div>
        <span class="badge b-${o.status} self-start">${TX[lang].st[o.status]}</span>
      </div>
      <p class="text-sm text-white"><i class="fa-solid fa-user text-slate-500"></i> ${esc(o.name)} · <span dir="ltr">${esc(o.phone)}</span></p>
      <p class="text-sm text-slate-400 mt-1">${o.type === 'delivery' ? t('delivery_to') + ': ' + esc(o.address) : t('takeaway')} · ${t('pay')}: ${o.pay === 'cash' ? t('cash') : t('card')}</p>
      <ul class="text-sm mt-3 space-y-1 border-t border-slate-800 pt-3">
        ${o.items.map(it => `<li>${it.qty} × ${esc(it.name)} ${it.note ? '<span class="text-slate-500">(' + esc(it.note) + ')</span>' : ''} <span class="font-mono text-slate-400">${money(it.price * it.qty)}</span></li>`).join('')}
      </ul>
      <div class="flex flex-wrap justify-between items-center gap-3 mt-4 pt-3 border-t border-slate-800">
        <div class="flex flex-wrap gap-2">${actionButtons(o, i)}</div>
        <div class="flex items-center gap-4">
          <button onclick="deleteOrder(${i})" class="act-del">${t('del')}</button>
          <span class="font-black text-gold-400 font-mono">${t('total')}: ${money(o.total)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ================= UTIL ================= */
function closeModal(id) { $(id).classList.add('hidden'); }
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hidden', 'toast-in');
  void el.offsetWidth;
  el.classList.add('toast-in');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add('hidden'), 2800);
}

/* ================= INIT ================= */
function openPicker() { $('lang-picker').classList.remove('hidden'); }
window.addEventListener('load', () => {
  setLang('ku');
  $('lang-picker').classList.remove('hidden');
  revealAll();
  setInterval(() => { if (isAdmin) refreshAdmin(); }, 5000);
});
</script>
</body>
</html>
